<!DOCTYPE html>
<!-- data-bs-theme="dark" switches every Bootstrap component (forms, modals, dropdowns, tables) to dark colors -->
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Agriculture Information System - farmers, farms, crops, plantings, harvests, sales and reports">
  <meta name="theme-color" content="#000000">
  <title>Agriculture Information System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
</head>
<body>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen" class="login-wrap d-none">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="login-logo" aria-hidden="true"><i class="bi bi-flower3"></i></div>
        <h1 class="h3 fw-bold mb-1">Agriculture Information System</h1>
        <p class="text-muted mb-0">Farmers, farms, harvests and sales &mdash; all in one place.</p>
      </div>
      <div id="loginAlert" aria-live="polite"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email</label>
          <input id="loginEmail" type="email" class="form-control form-control-lg" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="loginPassword">Password</label>
          <input id="loginPassword" type="password" class="form-control form-control-lg" autocomplete="current-password" placeholder="Password" required>
        </div>
        <button id="loginButton" type="submit" class="btn btn-leaf btn-lg w-100">Sign in</button>
      </form>
      <p class="small text-muted text-center mt-4 mb-0"><i class="bi bi-shield-lock" aria-hidden="true"></i> Accounts are created by the Administrator.</p>
    </div>
  </div>

  <!-- ================= MAIN APP =================
       Left: sidebar menu (slides in from the left on phones and tablets)
       Right: main panel with a top bar and the current page -->
  <div id="appShell" class="app-shell d-none">

    <aside id="mainNav" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" aria-label="Main menu">
      <div class="sidebar-inner">
        <div class="d-flex align-items-center justify-content-between">
          <a class="brand" href="#dashboard">
            <span class="brand-mark" aria-hidden="true"><i class="bi bi-flower3"></i></span>AgriInfo
          </a>
          <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#mainNav" aria-label="Close menu"></button>
        </div>
        <!-- menu items are added by main.js (depends on the user's role) -->
        <nav aria-label="Pages"><ul class="side-nav" id="navLinks"></ul></nav>
      </div>
    </aside>

    <div class="main-panel">
      <header class="topbar">
        <button class="btn-round d-lg-none" id="btnMenu" type="button" data-bs-toggle="offcanvas" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-label="Open menu"><i class="bi bi-list" aria-hidden="true"></i></button>
        <span class="me-auto"></span>
        <span class="user-pill">
          <span class="avatar" id="userAvatar" aria-hidden="true"></span>
          <span id="userName"></span><span id="userRole"></span>
        </span>
        <button class="btn btn-pill-outline btn-sm" id="btnLogout"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Log out</button>
      </header>

      <main class="page-body">
        <!-- page-level messages are shown as toasts (see ui.js -> showAlert) -->
        <div id="alerts"></div>
        <div id="view"></div>
      </main>

      <footer class="text-center small py-3 no-print">
        Agriculture Information System &middot; Supabase PostgreSQL
      </footer>
    </div>
  </div>

  <!-- ================= TOAST MESSAGES (success / error pop-ups) ================= -->
  <div class="toast-stack" id="toasts"></div>

  <!-- ================= SHARED MODAL (view / add / edit / delete) ================= -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="appModalTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="appModalBody"></div>
        <div class="modal-footer" id="appModalFooter"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
